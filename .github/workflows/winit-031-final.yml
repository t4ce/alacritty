name: winit 0.31 final Ubuntu check

on:
  push:
    branches:
      - fix/winit-0.31-event-overhaul

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libfreetype6-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-xfixes0-dev

      - name: Prepare compatible path dependencies
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/t4ce/glutin.git ../glutin
          mkdir -p ../TRUEOS-Blueprints/vendor
          git clone --depth 1 https://github.com/rust-windowing/winit.git ../TRUEOS-Blueprints/vendor/winit
          git clone --branch v0.6.2 --depth 1 https://github.com/rust-windowing/raw-window-handle.git ../TRUEOS-Blueprints/vendor/raw-window-handle

      - name: Apply compatibility patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/winit-031-port.yml').read_text()
          block = source.split("python3 - <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/winit_port.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 /tmp/winit_port.py

          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing final patch anchor: {label}")
              return text.replace(old, new, 1)

          path = Path('alacritty/src/event.rs')
          s = path.read_text()
          s = replace_once(
              s,
              'use winit::event_loop::{ActiveEventLoop, ControlFlow, EventLoop};',
              'use winit::event_loop::run_on_demand::EventLoopExtRunOnDemand;\nuse winit::event_loop::{ActiveEventLoop, ControlFlow, EventLoop};',
              'run-on-demand import',
          )
          s = replace_once(
              s,
              '''    pub fn run(self, event_loop: EventLoop) -> Result<(), Box<dyn Error>> {
                  event_loop.run_app(self).map_err(Into::into)
              }''',
              '''    pub fn run(&mut self, mut event_loop: EventLoop) -> Result<(), Box<dyn Error>> {
                  let result = event_loop.run_app_on_demand(&mut *self);
                  self.cleanup();

                  match self.initial_window_error.take() {
                      Some(initial_window_error) => Err(initial_window_error),
                      _ => result.map_err(Into::into),
                  }
              }''',
              'processor run ownership',
          )
          s = replace_once(
              s,
              '''                        Ime::Disabled => {
                                  self.ctx.display.ime.set_enabled(false);
                                  *self.ctx.dirty = true;
                              },''',
              '''                        Ime::Disabled => {
                                  self.ctx.display.ime.set_enabled(false);
                                  *self.ctx.dirty = true;
                              },
                              // Alacritty does not currently provide surrounding-text state to IMEs.
                              Ime::DeleteSurrounding { .. } => (),''',
              'delete surrounding IME event',
          )
          path.write_text(s)

          path = Path('alacritty/src/main.rs')
          s = path.read_text()
          s = replace_once(
              s,
              '    let processor = Processor::new(config, options, &window_event_loop, event_proxy, event_rx);',
              '    let mut processor = Processor::new(config, options, &window_event_loop, event_proxy, event_rx);',
              'mutable processor',
          )
          path.write_text(s)
          PY

          cargo fmt --all

      - name: Check Alacritty on Ubuntu
        run: cargo check -p alacritty

      - name: Commit source changes
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            alacritty/src/event.rs \
            alacritty/src/window_context.rs \
            alacritty/src/input/mod.rs \
            alacritty/src/display/window.rs \
            alacritty/src/main.rs
          if ! git diff --cached --quiet; then
            git commit -m "Complete winit 0.31 event migration"
            git push origin HEAD:fix/winit-0.31-event-overhaul
          fi
