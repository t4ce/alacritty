name: winit 0.31 exact Ubuntu check

on:
  push:
    branches:
      - fix/winit-0.31-event-overhaul

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libfontconfig1-dev \
            libfreetype6-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libxcb-xfixes0-dev

      - name: Prepare user's path dependencies
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/t4ce/glutin.git ../glutin
          git clone --depth 1 https://github.com/t4ce/TRUEOS-Blueprints.git ../TRUEOS-Blueprints

      - name: Apply compatibility patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/winit-031-port.yml').read_text()
          block = source.split("python3 - <<'PY'\n", 1)[1].split("\n          PY\n", 1)[0]
          lines = []
          for line in block.splitlines():
              lines.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/winit_port.py').write_text('\n'.join(lines) + '\n')
          PY
          python3 /tmp/winit_port.py
          cargo fmt --all

      - name: Check Alacritty on Ubuntu
        run: cargo check -p alacritty

      - name: Commit source changes
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alacritty/src/event.rs alacritty/src/window_context.rs alacritty/src/input/mod.rs alacritty/src/display/window.rs
          if ! git diff --cached --quiet; then
            git commit -m "Complete winit 0.31 event migration"
            git push origin HEAD:fix/winit-0.31-event-overhaul
          fi
