name: winit 0.31 port check

on:
  push:
    branches:
      - fix/winit-0.31-event-overhaul

permissions:
  contents: write

jobs:
  port:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare local path dependencies
        shell: bash
        run: |
          set -euxo pipefail
          git clone --depth 1 https://github.com/t4ce/glutin.git ../glutin
          mkdir -p ../TRUEOS-Blueprints/vendor
          git clone --depth 1 https://github.com/rust-windowing/winit.git ../TRUEOS-Blueprints/vendor/winit
          git clone --depth 1 https://github.com/rust-windowing/raw-window-handle.git ../TRUEOS-Blueprints/vendor/raw-window-handle

      - name: Apply winit 0.31 compatibility patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing patch anchor: {label}")
              return text.replace(old, new, 1)

          # event.rs: replace removed winit Event/Touch plumbing with Alacritty-local queued events,
          # use the pointer event API, and consolidate ApplicationHandler.
          path = Path("alacritty/src/event.rs")
          s = path.read_text()
          s = replace_once(
              s,
              'use winit::event::{ElementState, Ime, Modifiers, MouseButton, StartCause, WindowEvent};',
              '''use winit::dpi::PhysicalPosition;
          use winit::event::{
              ButtonSource, ElementState, Ime, Modifiers, MouseButton, PointerKind, PointerSource,
              TouchPhase, WindowEvent,
          };''',
              "event imports",
          )

          start = s.index('    /// Check if an event is irrelevant and can be skipped.')
          end = s.index('\n}\n\nimpl ApplicationHandler for Processor', start)
          s = s[:start] + '''    /// Check if an event is irrelevant and can be skipped.
              fn skip_window_event(event: &WindowEvent) -> bool {
                  matches!(
                      event,
                      WindowEvent::KeyboardInput { is_synthetic: true, .. }
                          | WindowEvent::ActivationTokenDone { .. }
                          | WindowEvent::DoubleTapGesture { .. }
                          | WindowEvent::TouchpadPressure { .. }
                          | WindowEvent::RotationGesture { .. }
                          | WindowEvent::PinchGesture { .. }
                          | WindowEvent::PanGesture { .. }
                          | WindowEvent::Destroyed
                          | WindowEvent::ThemeChanged(_)
                          | WindowEvent::Moved(_)
                  )
              }
          ''' + s[end:]

          new_events_start = s.index('    fn new_events(&mut self, event_loop: &dyn ActiveEventLoop, cause: StartCause) {')
          window_event_start = s.index('    fn window_event(', new_events_start)
          s = s[:new_events_start] + s[window_event_start:]

          proxy_marker = '    fn proxy_wake_up(&mut self, event_loop: &dyn ActiveEventLoop) {'
          proxy_at = s.index(proxy_marker)
          lifecycle = '''    fn can_create_surfaces(&mut self, event_loop: &dyn ActiveEventLoop) {
                  if self.cli_options.daemon {
                      return;
                  }

                  if let Some(window_options) = self.initial_window_options.take() {
                      if let Err(err) = self.create_initial_window(event_loop, window_options) {
                          self.initial_window_error = Some(err);
                          event_loop.exit();
                          return;
                      }
                      info!("Initialisation complete");
                  }
              }

              fn about_to_wait(&mut self, event_loop: &dyn ActiveEventLoop) {
                  if self.config.debug.print_events {
                      info!(target: LOG_TARGET_WINIT, "About to wait");
                  }

                  for window_context in self.windows.values_mut() {
                      window_context.handle_event(
                          #[cfg(target_os = "macos")]
                          event_loop,
                          &self.proxy,
                          &mut self.clipboard,
                          &mut self.scheduler,
                          WinitEvent::AboutToWait,
                      );
                  }

                  let control_flow = match self.scheduler.update() {
                      Some(instant) => ControlFlow::WaitUntil(instant),
                      None => ControlFlow::Wait,
                  };
                  event_loop.set_control_flow(control_flow);
              }

          '''
          s = s[:proxy_at] + lifecycle + s[proxy_at:]

          second_impl = s.index('\nimpl ApplicationHandler for Processor {\n    fn about_to_wait')
          events_marker = s.index('\n/// Alacritty events.', second_impl)
          replacement = '''
          impl Processor {
              fn cleanup(&mut self) {
                  if self.config.debug.print_events {
                      info!("Exiting the event loop");
                  }

                  match self.gl_config.take().map(|config| config.display()) {
                      #[cfg(not(target_os = "macos"))]
                      Some(glutin::display::Display::Egl(display)) => {
                          self.windows.clear();
                          // SAFETY: all windows and their contexts have been destroyed first.
                          unsafe {
                              display.terminate();
                          }
                      },
                      _ => (),
                  }

                  // SAFETY: drop the real clipboard before the event loop/display is torn down.
                  self.clipboard = Clipboard::new_nop();
              }
          }

          impl Drop for Processor {
              fn drop(&mut self) {
                  self.cleanup();
              }
          }

          /// Internal event envelope replacing winit's removed generic `Event<T>`.
          #[derive(Debug, Clone)]
          pub enum WinitEvent {
              WindowEvent { window_id: WindowId, event: WindowEvent },
              UserEvent(Event),
              AboutToWait,
          }

          impl From<Event> for WinitEvent {
              fn from(event: Event) -> Self {
                  Self::UserEvent(event)
              }
          }

          /// Touch data reconstructed from winit's unified pointer events.
          #[derive(Debug, Clone, Copy)]
          pub struct TouchEvent {
              pub phase: TouchPhase,
              pub location: PhysicalPosition<f64>,
              pub id: u64,
          }
          '''
          s = s[:second_impl] + '\n' + replacement + s[events_marker:]

          s = s.replace('EventLoopProxy<Event>', 'EventLoopProxy')
          s = s.replace('pub fn handle_event(&mut self, event: WinitEvent<Event>)', 'pub fn handle_event(&mut self, event: WinitEvent)')
          s = s.replace('WindowEvent::Resized(size)', 'WindowEvent::SurfaceResized(size)')

          s = replace_once(
              s,
              '''                    WindowEvent::MouseInput { state, button, .. } => {
                                  self.ctx.window().set_mouse_visible(true);
                                  self.mouse_input(state, button);
                              },
                              WindowEvent::CursorMoved { position, .. } => {
                                  self.ctx.window().set_mouse_visible(true);
                                  self.mouse_moved(position);
                              },''',
              '''                    WindowEvent::PointerButton { state, button, position, .. } => {
                                  match button {
                                      ButtonSource::Touch { finger_id, .. } => {
                                          let phase = if state == ElementState::Pressed {
                                              TouchPhase::Started
                                          } else {
                                              TouchPhase::Ended
                                          };
                                          self.touch(TouchEvent {
                                              phase,
                                              location: position,
                                              id: finger_id.into_raw() as u64,
                                          });
                                      },
                                      button => {
                                          self.ctx.window().set_mouse_visible(true);
                                          self.mouse_moved(position);
                                          if let Some(button) = button.mouse_button() {
                                              self.mouse_input(state, button);
                                          }
                                      },
                                  }
                              },
                              WindowEvent::PointerMoved { position, source, .. } => match source {
                                  PointerSource::Touch { finger_id, .. } => self.touch(TouchEvent {
                                      phase: TouchPhase::Moved,
                                      location: position,
                                      id: finger_id.into_raw() as u64,
                                  }),
                                  _ => {
                                      self.ctx.window().set_mouse_visible(true);
                                      self.mouse_moved(position);
                                  },
                              },''',
              "pointer input",
          )
          s = replace_once(
              s,
              '                    WindowEvent::Touch(touch) => self.touch(touch),\n',
              '',
              "removed touch event",
          )
          s = replace_once(
              s,
              '''                    WindowEvent::DroppedFile(path) => {
                                  let path: String = path.to_string_lossy().into();
                                  self.ctx.paste(&(path + " "), true);
                              },
                              WindowEvent::CursorLeft { .. } => {
                                  self.ctx.mouse.inside_text_area = false;

                                  if self.ctx.display().highlighted_hint.is_some() {
                                      *self.ctx.dirty = true;
                                  }
                              },''',
              '''                    WindowEvent::PointerLeft { kind, .. } => {
                                  if !matches!(kind, PointerKind::Touch(_)) {
                                      self.ctx.mouse.inside_text_area = false;

                                      if self.ctx.display().highlighted_hint.is_some() {
                                          *self.ctx.dirty = true;
                                      }
                                  }
                              },''',
              "pointer left and old drop",
          )

          ignore_start = s.index('                    WindowEvent::KeyboardInput { is_synthetic: true, .. }', s.index('pub fn handle_event(&mut self, event: WinitEvent)'))
          ignore_end_token = '                    | WindowEvent::Moved(_) => (),'
          ignore_end = s.index(ignore_end_token, ignore_start) + len(ignore_end_token)
          s = s[:ignore_start] + '                    _ => (),' + s[ignore_end:]

          old_outer = '''            WinitEvent::Suspended
                      | WinitEvent::NewEvents { .. }
                      | WinitEvent::DeviceEvent { .. }
                      | WinitEvent::LoopExiting
                      | WinitEvent::Resumed
                      | WinitEvent::MemoryWarning
                      | WinitEvent::AboutToWait => (),'''
          s = replace_once(s, old_outer, '            WinitEvent::AboutToWait => (),', "removed outer winit Event variants")
          path.write_text(s)

          # window_context.rs: queue the internal envelope and use Alacritty's proxy wrapper.
          path = Path('alacritty/src/window_context.rs')
          s = path.read_text()
          s = replace_once(
              s,
              'use winit::event::{Event as WinitEvent, Modifiers, WindowEvent};\nuse winit::event_loop::{ActiveEventLoop, EventLoopProxy};',
              'use winit::event::{Modifiers, WindowEvent};\nuse winit::event_loop::ActiveEventLoop;',
              'window context winit imports',
          )
          s = replace_once(
              s,
              '''use crate::event::{
              ActionContext, Event, EventProxy, InlineSearchState, Mouse, SearchState, TouchPurpose,
          };''',
              '''use crate::event::{
              ActionContext, Event, EventLoopProxy, EventProxy, InlineSearchState, Mouse, SearchState,
              TouchPurpose, WinitEvent,
          };''',
              'window context local imports',
          )
          s = s.replace('WinitEvent<Event>', 'WinitEvent')
          s = s.replace('EventLoopProxy<Event>', 'EventLoopProxy')
          path.write_text(s)

          # input/mod.rs: consume Alacritty's reconstructed touch type.
          path = Path('alacritty/src/input/mod.rs')
          s = path.read_text()
          s = replace_once(
              s,
              '''use winit::event::{
              ElementState, Modifiers, MouseButton, MouseScrollDelta, Touch as TouchEvent, TouchPhase,
          };''',
              '''use winit::event::{ElementState, Modifiers, MouseButton, MouseScrollDelta, TouchPhase};''',
              'input touch import',
          )
          s = replace_once(
              s,
              '''use crate::event::{
              ClickState, Event, EventType, InlineSearchState, Mouse, TouchPurpose, TouchZoom,
          };''',
              '''use crate::event::{
              ClickState, Event, EventType, InlineSearchState, Mouse, TouchEvent, TouchPurpose, TouchZoom,
          };''',
              'local touch import',
          )
          path.write_text(s)

          # display/window.rs: startup notification and embedding are platform attributes in 0.31.
          path = Path('alacritty/src/display/window.rs')
          s = path.read_text()
          s = replace_once(
              s,
              '''use winit::platform::startup_notify::{
              self, EventLoopExtStartupNotify, WindowAttributesExtStartupNotify,
          };''',
              '''use winit::platform::startup_notify::{self, EventLoopExtStartupNotify};''',
              'startup notify imports',
          )
          s = replace_once(
              s,
              '''#[cfg(all(not(feature = "x11"), not(any(target_os = "macos", windows))))]
          use winit::platform::wayland::WindowAttributesExtWayland;''',
              '''#[cfg(all(feature = "wayland", not(any(target_os = "macos", windows))))]
          use winit::platform::wayland::{ActiveEventLoopExtWayland, WindowAttributesWayland};''',
              'wayland attributes import',
          )

          call_old = '''        let mut window_attributes = Window::get_platform_window(
                      &identity,
                      &config.window,
                      #[cfg(all(feature = "x11", not(any(target_os = "macos", windows))))]
                      x11_visual,
                      #[cfg(target_os = "macos")]
                      &options.window_tabbing_id.take(),
                  );'''
          call_new = '''        let mut window_attributes = Window::get_platform_window(
                      &identity,
                      &config.window,
                      #[cfg(target_os = "macos")]
                      &options.window_tabbing_id.take(),
                  );'''
          s = replace_once(s, call_old, call_new, 'platform window call')

          old_startup = '''        #[cfg(not(any(target_os = "macos", windows)))]
                  if let Some(token) = options
                      .activation_token
                      .take()
                      .map(ActivationToken::from_raw)
                      .or_else(|| event_loop.read_token_from_env())
                  {
                      log::debug!("Activating window with token: {token:?}");
                      window_attributes = window_attributes.with_activation_token(token);

                      // Remove the token from the env.
                      startup_notify::reset_activation_token_env();
                  }

                  // On X11, embed the window inside another if the parent ID has been set.
                  #[cfg(all(feature = "x11", not(any(target_os = "macos", windows))))]
                  if let Some(parent_window_id) = event_loop.is_x11().then_some(config.window.embed).flatten()
                  {
                      window_attributes = window_attributes.with_embed_parent_window(parent_window_id);
                  }
          '''
          new_startup = '''        #[cfg(not(any(target_os = "macos", windows)))]
                  let activation_token = options
                      .activation_token
                      .take()
                      .map(ActivationToken::from_raw)
                      .or_else(|| event_loop.read_token_from_env());

                  #[cfg(not(any(target_os = "macos", windows)))]
                  if let Some(token) = activation_token.as_ref() {
                      log::debug!("Activating window with token: {token:?}");
                      startup_notify::reset_activation_token_env();
                  }

                  #[cfg(all(feature = "x11", not(any(target_os = "macos", windows))))]
                  if event_loop.is_x11() {
                      let mut attributes = WindowAttributesX11::default()
                          .with_name(&identity.class.general, &identity.class.instance);
                      if let Some(visual) = x11_visual {
                          attributes = attributes.with_x11_visual(visual.visual_id() as u32);
                      }
                      if let Some(token) = activation_token.clone() {
                          attributes = attributes.with_activation_token(token);
                      }
                      if let Some(parent_window_id) = config.window.embed {
                          attributes = attributes.with_embed_parent_window(parent_window_id);
                      }
                      window_attributes =
                          window_attributes.with_platform_attributes(Box::new(attributes));
                  }

                  #[cfg(all(feature = "wayland", not(any(target_os = "macos", windows))))]
                  if event_loop.is_wayland() {
                      let mut attributes = WindowAttributesWayland::default()
                          .with_name(&identity.class.general, &identity.class.instance);
                      if let Some(token) = activation_token {
                          attributes = attributes.with_activation_token(token);
                      }
                      window_attributes =
                          window_attributes.with_platform_attributes(Box::new(attributes));
                  }
          '''
          s = replace_once(s, old_startup, new_startup, 'platform startup/embed logic')

          func_start = s.index('    #[cfg(not(any(target_os = "macos", windows)))]\n    pub fn get_platform_window(')
          func_end = s.index('\n    #[cfg(windows)]\n    pub fn get_platform_window', func_start)
          old_func = s[func_start:func_end]
          new_func = '''    #[cfg(not(any(target_os = "macos", windows)))]
              pub fn get_platform_window(
                  _identity: &Identity,
                  window_config: &WindowConfig,
              ) -> WindowAttributes {
                  #[cfg(feature = "x11")]
                  let icon = {
                      let mut decoder = Decoder::new(Cursor::new(WINDOW_ICON));
                      decoder.set_transformations(png::Transformations::normalize_to_color8());
                      let mut reader = decoder.read_info().expect("invalid embedded icon");
                      let mut buf = vec![0; reader.output_buffer_size()];
                      let _ = reader.next_frame(&mut buf);
                      RgbaIcon::new(buf, reader.info().width, reader.info().height)
                          .expect("invalid embedded icon format")
                          .into()
                  };

                  let builder = WindowAttributes::default()
                      .with_decorations(window_config.decorations != Decorations::None);

                  #[cfg(feature = "x11")]
                  let builder = builder.with_window_icon(Some(icon));

                  builder
              }
          '''
          s = s[:func_start] + new_func + s[func_end:]
          path.write_text(s)
          PY

          cargo fmt --all

      - name: Check Alacritty on Ubuntu against current winit
        run: cargo check -p alacritty

      - name: Commit source changes
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alacritty/src/event.rs alacritty/src/window_context.rs alacritty/src/input/mod.rs alacritty/src/display/window.rs
          if ! git diff --cached --quiet; then
            git commit -m "Complete winit 0.31 event migration"
            git push origin HEAD:fix/winit-0.31-event-overhaul
          fi
